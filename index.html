<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고슐랭</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b2420;--sub:#7a6d63;--line:#e6dccf;--accent:#8b2635;--accent-soft:#f3e3e3;--chip:#efe6da}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#27221e;--ink:#efe7dd;--sub:#a99c90;--line:#3a332d;--accent:#e07a85;--accent-soft:#3a2427;--chip:#332c26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
header{padding:28px 16px 12px;max-width:960px;margin:0 auto}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.lead{color:var(--sub);margin:4px 0 0;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.stat b{color:var(--accent)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filters-in{max-width:960px;margin:0 auto;padding:10px 16px;display:grid;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row label{font-size:12px;color:var(--sub);min-width:34px}
input[type=search],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:0}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:960px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:17px;font-weight:700;margin:0}
.loc{font-size:12px;color:var(--sub)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--sub)}
.badge.선정{background:var(--accent);border-color:var(--accent);color:#fff}
.grade{font-size:13px;color:var(--accent);font-weight:600}
.age{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--card);margin-left:4px}
.grade.sug{color:var(--sub);font-weight:400}
.meta{font-size:13px;color:var(--sub)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.note{font-size:14px}
.note p{margin:0}
details{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--sub)}
details p,details ul{margin:4px 0}
details ul{padding-left:18px}
dl{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;margin:6px 0}
dt{color:var(--sub)}dd{margin:0}
.unk{color:#b07a2a}
a{color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1><span>고</span>슐랭</h1>
  <p class="lead">고민수가 직접 먹어보고 고른 맛집 · 1 근처면 가볼 만하다 · 2 이거 먹으러 가볼 만하다 · 3 맛집 중의 맛집</p>
  <div class="stats" id="stats"></div>
</header>
<div class="filters"><div class="filters-in">
  <div class="row"><input type="search" id="q" placeholder="상호·메뉴·동네 검색"><select id="status"></select><select id="grade"></select></div>
  <div class="row" id="sido"><label>지역</label></div>
  <div class="row" id="tagrow"><label>태그</label></div>
</div></div>
<main id="list"></main>

rget=\"_blank\" rel=\"noopener\">https://www.khan.co.kr/article/201404081750022<\/a><\/li><li>[서울앤] &#x27;서울로&#x27; 걸은 뒤 중리단길 어때요? — <a href=\"https://www.seouland.com/arti/culture/culture_general/2838.html\" target=\"_blank\" rel=\"noopener\">https://www.seouland.com/arti/culture/culture_general/2838.html<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-31 확인)<\/li><\/ul>"}, {"name": "회화원", "status": "선정", "grade": "", "gradeSug": "2", "sido": "서울", "sgg": "관악구", "dong": "사당", "addr": "서울 관악구 남현1길 68-18 네스코로와 1층", "genre": "양꼬치", "menu": "양꼬치", "tags": ["술술", "한방", "분위기"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>양꼬치 자체가 다른 데보다 맛있고 요리류도 다 맛있다. 술이 술술 들어간다. 분위기도 괜찮고 맥주도 맛있다.<\/p>", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;회화원&#x27;). 행정구역은 관악구 남현동(사당역 인근).<\/li><li>&#x27;사당&#x27;은 동작구·서초구에 걸친 지역이라 시군구 확인 필요<\/li><\/ul>", "sources": "<ul><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "남양수산", "status": "선정", "grade": "", "gradeSug": "3", "sido": "제주", "sgg": "서귀포시", "dong": "성산읍", "addr": "제주 서귀포시 성산읍 고성동서로56번길 11", "genre": "횟집", "menu": "돌돔회, 지리탕", "tags": ["술술", "한방", "이것저것", "분위기"], "mood": "정겨움", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>돌돔회도 맛있지만 무엇보다 지리탕이 진짜 너무 맛있다. 회 먹고 지리탕, 밥 비벼 먹으면 소주가 술술 들어간다. 조잡하면서도 정겨운, 소주 먹기 좋은 분위기.<\/p>", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;남양수산&#x27;).<\/li><\/ul>", "sources": "<ul><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "덕성원 본점", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "서귀포시", "dong": "서귀동", "addr": "제주 서귀포시 태평로401번길 4", "genre": "중식", "menu": "꽃게짬뽕, 자장면", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "A (업력 30년 이상), C (꽃게짬뽕으로 이름남)", "year": "1945", "src": "2", "age": "80년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;덕성원&#x27;). 서귀동 474. 같은 상호로 중문동점·이도점이 따로 검색됨. 지점명이 없는 서귀동 &#x27;덕성원&#x27;을 본점으로 판단.<\/li><li>개업연도 1945는 대략치(정확한 개업연도 아님): 제주시 개업 연도 기준. 서귀포 이전은 1950년(한겨레). 아래 원문 참고.<\/li><li>지점: 서귀포시 본점(원덕성원), 중문점, 제주시 이도동점이 있음(파이낸셜뉴스 2017). 이 파일은 **서귀포 본점** 기준.<\/li><li>개업연도 출처마다 다름 → `확인 필요`:<\/li><\/ul><p>  - 파이낸셜뉴스(2017, 제주관광공사 추천 기사): &quot;1945년에 개점했다. 3대째 운영되는 전통 중국집&quot;.<\/p><p>  - 한겨레(2009): 조부가 &quot;1945년 제주시에 작은 자장면집을 열었다&quot;, &quot;1950년 서귀포로 넘어와 … &#x27;덕성원&#x27;이란 간판을 내걸고&quot;. 2005년 10월 현 건물 신축.<\/p><ul><li>소재지 [단일출처]: &quot;서귀포시 서귀동 이중섭거리 근처&quot;(파이낸셜뉴스).<\/li><li>메뉴: 꽃게짬뽕(인기 메뉴), 삼선고추짬뽕, 흰짬뽕, 겨울 별미 꿩탕수육·꿩깐풍기(파이낸셜뉴스, 2017 기준).<\/li><li>화교 3대 운영(한겨레: 왕옥해 사장, 2009 기준).<\/li><\/ul>", "sources": "<ul><li>[파이낸셜뉴스, 2017.12.30] 겨울에는 짬뽕, &#x27;제주도민이면 다 아는 짬뽕집 7선&#x27; — <a href=\"https://www.fnnews.com/news/201712301544210768\" target=\"_blank\" rel=\"noopener\">https://www.fnnews.com/news/201712301544210768<\/a><\/li><li>[한겨레, 2009.04.08] 제주도 자장면의 다른 이름, 원덕성원 — <a href=\"https://www.hani.co.kr/arti/specialsection/esc_section/348771.html\" target=\"_blank\" rel=\"noopener\">https://www.hani.co.kr/arti/specialsection/esc_section/348771.html<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "돌하르방식당", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "제주시", "dong": "일도2동", "addr": "제주 제주시 신산로11길 53", "genre": "향토음식 (생선국)", "menu": "각재기국, 멜국", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "A (업력 30년 이상), D (제주 향토음식 각재기국)", "year": "1986", "src": "2", "age": "40년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;돌하르방식당&#x27;). 지번 일도2동 320-14.<\/li><li>개업연도 1986는 대략치(정확한 개업연도 아님): 운영자 인터뷰 &#x27;86년부터 시작&#x27;(제주의소리). 아래 원문 참고.<\/li><li>운영자 강영채 어르신(2024.10 기사 기준 91세)이 모든 음식을 직접 조리. 메뉴: 각재기국, 해물뚝배기, 멜국, 자리돔 철 자리물회(제주의소리).<\/li><li>개업연도 출처마다 다름 → `확인 필요`:<\/li><\/ul><p>  - 제주의소리(2024) 본인 인터뷰 원문: &quot;86년부터 시작했는데 정식으로 영업한 것은 91년인가 92년이야. 지금 이 자리에서 쭉 했어.&quot;<\/p><p>  - 티브이데일리(2015, 방송 소개 기사): &quot;1987년 개업 후 29년 째 영업 중&quot;.<\/p><p>  - 어느 기준이든 업력 30년 이상.<\/p><ul><li>제주산 좁쌀 섞은 밥, 멜젓 직접 담금, 재료 대부분 제주산(제주의소리).<\/li><li>두 번째 출처(티브이데일리)는 2015 tvN &#x27;수요미식회&#x27; 방송 소개 기사임(방송은 보조 근거).<\/li><li>영업 확인: 2024.10.19 기사까지 영업 중. 어르신 발언 &quot;내가 걷지 못할 때 안 한다&quot;. 고령 1인 운영이라 방문 전 영업 여부 재확인 권장.<\/li><\/ul>", "sources": "<ul><li>[제주의소리, 2024.10.05] &#x27;제주 각재기국&#x27; 대표 식당 어르신의 파란만장했던 지난 시절 — <a href=\"https://www.jejusori.net/news/articleView.html?idxno=430698\" target=\"_blank\" rel=\"noopener\">https://www.jejusori.net/news/articleView.html?idxno=430698<\/a><\/li><li>[제주의소리, 2024.10.19] 제주 각재기국 한 그릇에 담긴 90세 오너셰프의 고집·정성 — <a href=\"https://www.jejusori.net/news/articleView.html?idxno=431071\" target=\"_blank\" rel=\"noopener\">https://www.jejusori.net/news/articleView.html?idxno=431071<\/a><\/li><li>[티브이데일리, 2015.06] &#x27;수요미식회&#x27; 제주도 돌하르방 식당, 6.25 참전용사 직접 운영 &#x27;각재기국 맛집&#x27; — <a href=\"https://tvdaily.co.kr/read.php3?aid=1433990376921863019\" target=\"_blank\" rel=\"noopener\">https://tvdaily.co.kr/read.php3?aid=1433990376921863019<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "보영반점", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "제주시", "dong": "한림읍 한림리", "addr": "제주 제주시 한림읍 한림로 692-1", "genre": "중식", "menu": "간짬뽕, 탕수육", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "A (1967년 개업), C (간짬뽕으로 이름남)", "year": "1967", "src": "2", "age": "50년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;보영&#x27;). 네이버 등록 상호는 &#x27;보영&#x27;(한림리 1305-16). GQ코리아 기사 주소와 일치.<\/li><li>개업: 파이낸셜뉴스 &quot;1967년 문을 연 곳이다. 반세기가 넘은 곳으로 화교가 운영&quot;, 한겨레 &quot;67년에 문을 연 보영반점&quot;.<\/li><li>메뉴: 대표 메뉴 간짬뽕(볶음짬뽕). &quot;다른 곳은 면까지 볶는데, 이곳은 비벼 먹는 짬뽕&quot;, 옛날식 탕수육(파이낸셜뉴스). 한겨레: &quot;차림표가 소박&quot;, &quot;&#x27;간짬뽕&#x27;과 &#x27;탕수육&#x27;만 주문하면…&quot;(동행한 제주 음식 연구자 발언).<\/li><li>참고: GQ코리아 기사에 주소 &quot;제주시 한림읍 한림로 692-1&quot;이 있으나 원문을 확인하지 못해 주소 칸에 넣지 않음.<\/li><li>확인하지 못한 것: 최근(2020년 이후) 기사를 찾지 못해 현재 영업 여부는 확인하지 못함(폐업 근거도 없음).<\/li><\/ul>", "sources": "<ul><li>[파이낸셜뉴스, 2017.12.30] 겨울에는 짬뽕, &#x27;제주도민이면 다 아는 짬뽕집 7선&#x27; — <a href=\"https://www.fnnews.com/news/201712301544210768\" target=\"_blank\" rel=\"noopener\">https://www.fnnews.com/news/201712301544210768<\/a><\/li><li>[한겨레, 수정 2019.10.20] 봄바람 따라 떠난 제주 &#x27;진짜 토종맛&#x27; 여행 — <a href=\"https://www.hani.co.kr/arti/specialsection/esc_section/741526.html\" target=\"_blank\" rel=\"noopener\">https://www.hani.co.kr/arti/specialsection/esc_section/741526.html<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "산방식당 본점", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "서귀포시", "dong": "대정읍 하모리", "addr": "제주 서귀포시 대정읍 하모이삼로 62", "genre": "밀면", "menu": "밀냉면, 비빔밀냉면, 수육", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "A (1971년 개업), C (밀면 전문), D (제주식 밀면)", "year": "1971", "src": "3", "age": "50년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;산방식당&#x27;). 지번 하모리 864-3. 머니투데이(2013) 지번·GQ코리아(2024) 도로명과 일치.<\/li><li>개업: 제주의소리 &quot;산방식당은 1971년 서귀포시 대정읍 하모리에서 문을 연 후&quot;, 머니투데이 &quot;1971년부터 40여 년간 밀면으로 명성&quot;, 헤드라인제주(2015) &quot;본점 개점 44주년&quot;.<\/li><li>2012년 제주시 이도지구에 제주점(대표 김형섭, 아들)이 따로 있음. 이 파일은 **본점**(대표 김정일) 기준. 제주점은 별도 평가 대상.<\/li><li>메뉴(머니투데이 2013): 밀냉면·비빔냉면·수육. &quot;멸치로만 우려낸 시원한 육수&quot;(헤드라인제주).<\/li><li>주소 참고: 머니투데이 2013 &quot;서귀포시 대정읍 하모리 864-3&quot;(지번), GQ코리아 2024 &quot;서귀포시 대정읍 하모이삼로 62&quot;(도로명). 같은 곳인지 대조하지 못해 주소 칸은 비워 둠.<\/li><li>기록용 감점 신호: 머니투데이 &quot;식사시간에는 줄을 서서 기다려야&quot; (웨이팅 언급, 이번 조사에서는 1개 출처).<\/li><\/ul>", "sources": "<ul><li>[제주의소리, 2017.03.06] 제주 산방식당, 2대째 이어진 &#x27;통큰 기부&#x27; — <a href=\"https://www.jejusori.net/news/articleView.html?idxno=188198\" target=\"_blank\" rel=\"noopener\">https://www.jejusori.net/news/articleView.html?idxno=188198<\/a><\/li><li>[헤드라인제주, 2015.03.04] &quot;100년 식당 꿈꾸죠&quot;...&#x27;산방&#x27; 김 父子의 나눔철학은? — <a href=\"https://www.headlinejeju.co.kr/news/articleView.html? ], "mood": "", "plus": "", "minus": "", "basis": "B (중기부 백년가게 2020 국민추천 선정)", "year": "1945", "src": "2", "age": "80년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;옹포별장가든&#x27;). 2019 방송 소개 기사의 주소와 일치.<\/li><li>개업연도 1945는 대략치(정확한 개업연도 아님): 제민일보 &#x27;1945년부터 3대째&#x27;. 아래 원문 참고.<\/li><li>2020.10 중기부 백년가게 선정(국민추천). 제민일보 원문: &quot;1945년부터 3대째 내려오는 식당으로 전복돌솥밥과 돔베고기 수육이 대표 메뉴&quot;, &quot;넓은 정원에 수령 100년이 넘는 수십 그루의 거목&quot;, &quot;업주가 직접 개발한 선인장김치와 귤김치&quot;.<\/li><li>개업연도: 제민일보는 &quot;1945년부터 3대째&quot;로 적었으나, 이것이 이 식당의 개업연도인지 가업의 시작인지 분명하지 않음. 푸드뉴스의 선정 목록에는 &quot;옹포별장가든: 제주, 전복돌솥밥ㆍ돔베고기 수육, 28&quot;로 숫자가 붙어 있으나 그 숫자의 의미가 기사에 설명되어 있지 않음 → `확인 필요`.<\/li><li>참고(보조): 2019.08 SBS &#x27;생방송 투데이&#x27; 소개 기사에 주소 &quot;제주 제주시 한림읍 한림상로 24&quot;가 있으나 방송 기사 하나뿐이라 주소 칸에는 넣지 않음.<\/li><li>폴리뉴스 등 일부 기사는 홍보성으로 보여 근거에서 제외함(Claude 판단).<\/li><\/ul>", "sources": "<ul><li>[제민일보, 2020.10.08] 옹포별장가든·로뎀나무 &#x27;백년가게&#x27; 선정 — <a href=\"https://www.jemin.com/news/articleView.html?idxno=704436\" target=\"_blank\" rel=\"noopener\">https://www.jemin.com/news/articleView.html?idxno=704436<\/a><\/li><li>[푸드뉴스, 2020.10.08] 대전 &#x27;성심당&#x27; 등 음식점 78개소 &#x27;백년가게&#x27; 선정 — <a href=\"https://www.foodnews.co.kr/news/articleView.html?idxno=75465\" target=\"_blank\" rel=\"noopener\">https://www.foodnews.co.kr/news/articleView.html?idxno=75465<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "진미명가식당", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "서귀포시", "dong": "안덕면 사계리", "addr": "제주 서귀포시 안덕면 사계남로 167", "genre": "횟집 (생선요리)", "menu": "다금바리 생선회", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "B (중기부 백년가게 2021 추가 선정)", "year": "1983", "src": "2", "age": "40년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;진미명가&#x27;). 네이버 등록 상호는 &#x27;진미명가&#x27;(안덕면 사계리). 제민일보의 안덕면 언급과 일치.<\/li><li>개업연도 1983는 대략치(정확한 개업연도 아님): 창립 43주년(2026.04, 제민일보) 역산. 아래 원문 참고.<\/li><li>2021.08 중기부 백년가게 추가 선정(이데일리). 기사 원문: &quot;제주 서귀포시에 위치한 &#x27;진미명가식당&#x27;은 제주 다금바리 명장인 강창건 대표가 생선을 버리는 것 하나 없이 요리로 만드는 &#x27;어산어소&#x27; 철학을 바탕으로 운영 중&quot;.<\/li><li>제민일보: &quot;2019년 12월 제주도 선정 향토 음식 장인에서 생선회류(다금바리 생선회) 부문 1호&quot;, &quot;제주도 가업승계 기업이자 백년 가게로 인증&quot;.<\/li><li>개업연도: 제민일보 2026.04.05 기사 &quot;오는 11일 창립 43주년&quot;, 2025.04.06 기사 &quot;창립 42주년&quot; → 역산하면 1983년이나, 연도 자체가 적힌 출처가 없어 `확인 필요`로 둠.<\/li><li>동네: 제민일보 2026 기사에 &quot;안덕면리상을 받았다&quot;는 언급만 있어 동네는 비워 둠. 문의 전화(기사 기재): 794-3639.<\/li><\/ul>", "sources": "<ul><li>[이데일리, 2021.08.26] 학화호도과자·제일인쇄소…백년가게·백년소공인 366개 추가 — <a href=\"https://n.news.naver.com/mnews/article/018/0005020325?sid=101\" target=\"_blank\" rel=\"noopener\">https://n.news.naver.com/mnews/article/018/0005020325?sid=101<\/a><\/li><li>[제민일보, 2025.04.06] 우리회사 창립기념일 — <a href=\"https://www.jemin.com/news/articleView.html?idxno=794557\" target=\"_blank\" rel=\"noopener\">https://www.jemin.com/news/articleView.html?idxno=794557<\/a><\/li><li>[제민일보, 2026.04.05] 우리회사 창립기념일 — <a href=\"https://www.jemin.com/news/articleView.html?idxno=835594\" target=\"_blank\" rel=\"noopener\">https://www.jemin.com/news/articleView.html?idxno=835594<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "해원횟집", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "제주시", "dong": "용담2동 (용두암 앞)", "addr": "제주 제주시 서해안로 687-6", "genre": "횟집", "menu": "제철 해산물·자연산 활어 코스", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "B (중기부 백년가게 2025 신규 지정)", "year": "확인 필요", "src": "3", "age": "", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;해원횟집&#x27;).<\/li><li>2025년 중기부 백년가게 신규 지정(2025.10.20 현판식). 제주의소리·제주도민일보 기사 기준. 두 기사 모두 같은 보도자료(소상공인시장진흥공단 제공)를 바탕으로 한 것으로 보임.<\/li><li>기사 원문: &quot;제주시 용두암 앞에서 3대째 가업을 이어온 전통 횟집&quot;, &quot;1960년대 창업주가 바닷가에서 잡은 생선과 해산물을 판매하며 시작해, 1970년대부터 본격적인 식당 영업&quot; → 연대로만 확인되어 개업연도는 `확인 필요`.<\/li><li>대표자 표기가 기사마다 다름: 2025.10 기사 &quot;3대째 운영자인 문승환 대표&quot;, 2026.06 삼다일보 &quot;해원횟집(대표 문두의)&quot;.<\/li><li>영업 확인: 2026.06.01 삼다일보 기사에 용담2동 소재 업체로 기탁 활동 보도.<\/li><\/ul>", "sources": "<ul><li>[제주의소리, 2025.10.24] 제주 해원횟집-신제주보말칼국수 &#x27;백년가게&#x27; 신규 지정 — <a href=\"https://www.jejusori.net/news/articleView.html?idxno=440576\" target=\"_blank\" rel=\"noopener\">https://www.jejusori.net/news/articleView.html?idxno=440576<\/a><\/li><li>[제주도민일보, 2025.10.24] 2025 제주 백년가게 신규 2곳 지정...신제주보말칼국수·해원횟집 — <a href=\"https://www.jejudomin.co.kr/news/articleView.html?idxno=314832\" target=\"_blank\" rel=\"noopener\">https://www.jejudomin.co.kr/news/articleView.html?idxno=314832<\/a><\/li><li>[삼다일보, 2026.06.01] 제주시 용담2동 해원횟집, 관내 취약 장애인 가구에 선풍기 기탁 — <a href=\"https://www.samdailbo.com/news/articleView.html?idxno=265232\" target=\"_blank\" rel=\"noopener\">https://www.samdailbo.com/news/articleView.html?idxno=265232<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "향원복집", "status": "후보", "grade": "", "gradeSug": "", "sido": "제주", "sgg": "서귀포시", "dong": "서귀동", "addr": "제주 서귀포시 부두로 43", "genre": "복어요리", "menu": "복어회, 복요리", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "A (업력 50년 이상), B (중기부 백년가게 2018)", "year": "1966", "src": "3", "age": "60년+", "checked": "2026-10-08", "note": "", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;향원복집&#x27;). 네이버 장소 정보에 등록되어 있음(서귀동 782).<\/li><li>개업연도 1966 [단일출처]: 아시아경제 원문 &quot;1966년에 문을 열고 52년째 영업&quot;. 아주경제(2019)는 &quot;50년이 넘는 세월&quot;로만 표기.<\/li><li>창업주(현 대표 강종호 사장의 선친)가 1964년 부산에서 일식 조리사 자격 취득, &quot;도내 첫 복사시미 요리 전문가&quot;(아시아경제). 1996년 현 대표가 승계.<\/li><li>양념장: &quot;유자향 양념장&quot;, &quot;마냥 얼큰하기보다는 시원하고 그저 걸쭉하기보다는 깔밋하다&quot;(아시아경제).<\/li><li>소재지: 제민일보 2020 &quot;서귀포시 서귀동 향원복집&quot;.<\/li><li>확인하지 못한 것: 2021년 이후 이 식당을 다룬 기사를 찾지 못해 현재 영업 여부는 확인하지 못함(폐업 근거도 없음). 백년가게 지정은 5년 유효라 현재 지정 상태도 미확인.<\/li><\/ul>", "sources": "<ul><li>[아시아경제, 2018.11.27] [한국의 백년가게] 최상급복어+식재료+특제소스 3박자…서귀포 향원복집 — <a href=\"https://www.asiae.co.kr/article/2018112715091739741\" target=\"_blank\" rel=\"noopener\">https://www.asiae.co.kr/article/2018112715091739741<\/a><\/li><li>[아주경제, 2019.01.23] 대 잇는 맛집 &#x27;백년가게&#x27; 어디? — <a href=\"https://www.ajunews.com/view/20190123144057487\" target=\"_blank\" rel=\"noopener\">https://www.ajunews.com/view/20190123144057487<\/a><\/li><li>[제민일보, 2020.10.08] 옹포별장가든·로뎀나무 &#x27;백년가게&#x27; 선정 — <a href=\"https://www.jemin.com/news/articleView.html?idxno=704436\" target=\"_blank\" rel=\"noopener\">https://www.jemin.com/news/articleView.html?idxno=704436<\/a><\/li><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "영성각", "status": "선정", "grade": "", "gradeSug": "3", "sido": "충남", "sgg": "서산시", "dong": "", "addr": "충남 서산시 해미면 남문1로 40-1", "genre": "중식", "menu": "짬뽕, 탕수육", "tags": ["인생기준", "한방"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>처음으로 짬뽕이 맛있다고 생각한 곳. 원래 면과 해산물 몇 개만 먹는데, 여기서 처음으로 건더기와 국물까지 다 먹었다. 탕수육도 괜찮다.<\/p>", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;영성각 본점&#x27;). 서산에서 검색되는 곳은 &#x27;영성각 본점&#x27;(해미면) 1곳.<\/li><\/ul>", "sources": "<ul><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}, {"name": "대교식당", "status": "선정", "grade": "", "gradeSug": "", "sido": "충북", "sgg": "단양군", "dong": "", "addr": "충북 단양군 단양읍 중앙2로 9", "genre": "해장국", "menu": "올갱이해장국", "tags": ["해장"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>아침에 올갱이해장국을 먹었는데 음식이 너무 좋았다. 해장이 너무 잘 되고 음식 자체를 잘하신다.<\/p>", "memo": "<ul><li>주소: 네이버 장소 정보 기준(등록 상호 &#x27;대교식당&#x27;).<\/li><\/ul>", "sources": "<ul><li>네이버 장소 정보 (네이버 통합검색 장소 결과, 2026-10-08 확인)<\/li><\/ul>"}], TAGS={"술술": "🍶", "한방": "🎯", "이것저것": "🍱", "푸짐": "🥘", "사주기좋은": "💰", "해장": "🍲", "현지그대로": "🗾", "분위기": "🏮", "노포": "⏳", "인생기준": "⭐"}, STATUS=["선정", "답사 예정", "후보", "보류", "탈락", "폐업 확인"], GRADES={"1": "근처면 가볼 만하다", "2": "이거 먹으러 가볼 만하다", "3": "맛집 중의 맛집"};
const st={q:"",status:"",grade:"",sido:new Set(),tags:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unk=v=>!v||v==="확인 필요"?'<span class="unk">확인 필요</span>':esc(v);

function initFilters(){
  const s=$("#status");s.innerHTML='<option value="">모든 상태</option>'+STATUS.map(x=>`<option>${x}</option>`).join("");
  const g=$("#grade");g.innerHTML='<option value="">모든 등급</option>'+Object.keys(GRADES).map(k=>`<option value="${k}">${k} · ${GRADES[k]}</option>`).join("")+'<option value="none">등급 미정</option>';
  const sidos=[...new Set(DATA.map(d=>d.sido||"확인 필요"))].sort();
  for(const x of sidos){const b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{st.sido.has(x)?st.sido.delete(x):st.sido.add(x);b.classList.toggle("on");render()};$("#sido").append(b)}
  for(const [k,e] of Object.entries(TAGS)){const b=document.createElement("button");b.className="chip";b.textContent=e+" "+k;b.onclick=()=>{st.tags.has(k)?st.tags.delete(k):st.tags.add(k);b.classList.toggle("on");render()};$("#tagrow").append(b)}
  $("#q").oninput=e=>{st.q=e.target.value.trim();render()};
  s.onchange=e=>{st.status=e.target.value;render()};
  g.onchange=e=>{st.grade=e.target.value;render()};
}
function match(d){
  if(st.status&&d.status!==st.status)return false;
  if(st.grade==="none"&&d.grade)return false;
  if(st.grade&&st.grade!=="none"&&d.grade!==st.grade)return false;
  if(st.sido.size&&!st.sido.has(d.sido||"확인 필요"))return false;
  for(const t of st.tags)if(!d.tags.includes(t))return false;
  if(st.q){const h=[d.name,d.menu,d.dong,d.sgg,d.sido,d.genre,d.addr].join(" ");if(!h.includes(st.q))return false}
  return true;
}
function card(d){
  const loc=[d.sido,d.sgg!=="확인 필요"?d.sgg:"",d.dong].filter(Boolean).join(" ");
  const grade=d.grade?`<div class="grade">${"★".repeat(+d.grade)} ${GRADES[d.grade]}</div>`:(d.status==="선정"?`<div class="grade sug">등급 미정${d.gradeSug?" (제안 "+esc(d.gradeSug)+")":""}</div>`:"");
  const tags=d.tags.map(t=>`<span class="tag">${TAGS[t]||""} ${esc(t)}${t==="분위기"&&d.mood?" · "+esc(d.mood):""}</span>`).join("");
  return `<article class="card">
  <div class="top"><div><h2 class="name">${esc(d.name)}${d.age?`<span class="age">업력 ${esc(d.age)}</span>`:""}</h2><div class="loc">${esc(loc)}</div></div><span class="badge ${esc(d.status)}">${esc(d.status)}</span></div>
  ${grade}
  <div class="meta">${esc(d.genre)}${d.menu?" · "+esc(d.menu):""}</div>
  ${tags?`<div class="tags">${tags}</div>`:""}
  ${d.note?`<div class="note">${d.note}</div>`:""}
  <details><summary>상세 정보</summary>
   <dl><dt>주소</dt><dd>${unk(d.addr)}</dd><dt>개업연도</dt><dd>${unk(d.year)}</dd>
   ${d.plus?`<dt>가점</dt><dd>${esc(d.plus)}</dd>`:""}${d.minus?`<dt>감점</dt><dd>${esc(d.minus)}</dd>`:""}
   <dt>진입근거</dt><dd>${esc(d.basis)||"-"}</dd><dt>출처 수</dt><dd>${esc(d.src)}</dd><dt>최종확인</dt><dd>${esc(d.checked)||"-"}</dd></dl>
   ${d.memo?"<b>조사 메모</b>"+d.memo:""}${d.sources?"<b>출처</b>"+d.sources:""}
  </details></article>`;
}
function render(){
  const list=DATA.filter(match).sort((a,b)=>(+b.grade||0)-(+a.grade||0)||a.sido.localeCompare(b.sido)||a.name.localeCompare(b.name));
  $("#list").innerHTML=list.length?list.map(card).join(""):'<p class="empty">조건에 맞는 식당이 없습니다.</p>';
  const c=s=>DATA.filter(d=>d.status===s).length;
  $("#stats").innerHTML=`<span class="stat">전체 <b>${DATA.length}</b></span><span class="stat">선정 <b>${c("선정")}</b></span><span class="stat">후보 <b>${c("후보")}</b></span><span class="stat">답사 예정 <b>${c("답사 예정")}</b></span><span class="stat">표시 중 <b>${list.length}</b></span>`;
}
initFilters();render();
</script>
</body>
</html>
