<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고슐랭</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b2420;--sub:#7a6d63;--line:#e6dccf;--accent:#8b2635;--accent-soft:#f3e3e3;--chip:#efe6da}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#27221e;--ink:#efe7dd;--sub:#a99c90;--line:#3a332d;--accent:#e07a85;--accent-soft:#3a2427;--chip:#332c26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
header{padding:28px 16px 12px;max-width:960px;margin:0 auto}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.lead{color:var(--sub);margin:4px 0 0;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px}
.stat b{color:var(--accent)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filters-in{max-width:960px;margin:0 auto;padding:10px 16px;display:grid;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row label{font-size:12px;color:var(--sub);min-width:34px}
input[type=search],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:0}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:960px;margin:0 auto;padding:14px 16px 60px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:17px;font-weight:700;margin:0}
.loc{font-size:12px;color:var(--sub)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--sub)}
.badge.선정{background:var(--accent);border-color:var(--accent);color:#fff}
.grade{font-size:13px;color:var(--accent);font-weight:600}
.age{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--card);margin-left:4px}
.grade.sug{color:var(--sub);font-weight:400}
.meta{font-size:13px;color:var(--sub)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.note{font-size:14px}
.note p{margin:0}
details{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--sub)}
details p,details ul{margin:4px 0}
details ul{padding-left:18px}
dl{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;margin:6px 0}
dt{color:var(--sub)}dd{margin:0}
.unk{color:#b07a2a}
a{color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1><span>고</span>슐랭</h1>
  <p class="lead">고민수가 직접 먹어보고 고른 맛집 · 1 근처면 가볼 만하다 · 2 이거 먹으러 가볼 만하다 · 3 맛집 중의 맛집</p>
  <div class="stats" id="stats"></div>
</header>
<div class="filters"><div class="filters-in">
  <div class="row"><input type="search" id="q" placeholder="상호·메뉴·동네 검색"><select id="status"></select><select id="grade"></select></div>
  <div class="row" id="sido"><label>지역</label></div>
  <div class="row" id="tagrow"><label>태그</label></div>
</div></div>
<main id="list"></main>
<script>
const DATA=[{"name": "국수집", "status": "선정", "grade": "", "gradeSug": "", "sido": "경기", "sgg": "안양시 동안구", "dong": "", "addr": "경기 안양시 동안구 흥안대로145번길 79", "genre": "국수", "menu": "국수", "tags": ["사주기좋은"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>가격 대비 매우 괜찮은 국수집.<\/p>", "memo": "<ul><li>정식 상호 확인 필요 (고민수 기록상 명칭: 국수집)<\/li><\/ul>", "sources": ""}, {"name": "뎅과꼬치로 안양직영점", "status": "선정", "grade": "", "gradeSug": "", "sido": "경기", "sgg": "안양시", "dong": "", "addr": "확인 필요", "genre": "일식", "menu": "", "tags": ["현지그대로"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>동네 맛집인데 음식 하나하나가 너무 맛있다. 일본 맛이 제대로 난다. 일본 여행 가고 싶은데 못 갈 때 해소하러 한 번씩 간다.<\/p>", "memo": "<ul><li>본점·직영점 한두 곳 규모의 가게 (고민수 설명)<\/li><\/ul>", "sources": ""}, {"name": "백가원짬뽕", "status": "선정", "grade": "", "gradeSug": "2", "sido": "경기", "sgg": "화성시", "dong": "", "addr": "확인 필요", "genre": "중식", "menu": "양짬뽕, 굴짬뽕", "tags": ["한방", "푸짐"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>그냥 맛있는 짬뽕. 양짬뽕·굴짬뽕 재료가 넉넉히 들어가서 좋다.<\/p>", "memo": "", "sources": ""}, {"name": "백년지기삼계탕", "status": "선정", "grade": "", "gradeSug": "", "sido": "경기", "sgg": "안양시", "dong": "", "addr": "확인 필요", "genre": "삼계탕", "menu": "삼계탕", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>맛있다.<\/p>", "memo": "", "sources": ""}, {"name": "안양황소곱창", "status": "선정", "grade": "", "gradeSug": "1", "sido": "경기", "sgg": "안양시", "dong": "", "addr": "확인 필요", "genre": "소곱창", "menu": "소곱창", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>흔하게 맛있는 소곱창집.<\/p>", "memo": "", "sources": ""}, {"name": "정통춘천닭갈비", "status": "선정", "grade": "", "gradeSug": "", "sido": "경기", "sgg": "안양시", "dong": "", "addr": "확인 필요", "genre": "닭갈비", "menu": "닭갈비", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>맛있다.<\/p>", "memo": "", "sources": ""}, {"name": "황제막창", "status": "선정", "grade": "", "gradeSug": "", "sido": "경기", "sgg": "안양시", "dong": "", "addr": "확인 필요", "genre": "막창", "menu": "막창", "tags": [], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>맛있다.<\/p>", "memo": "", "sources": ""}, {"name": "낙영찜갈비", "status": "선정", "grade": "", "gradeSug": "2", "sido": "대구", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "찜갈비", "menu": "찜갈비", "tags": ["한방"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>마늘이 가득 찬 느낌, 맛 자체가 좋다.<\/p>", "memo": "", "sources": ""}, {"name": "효목골막창", "status": "선정", "grade": "", "gradeSug": "3", "sido": "대구", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "막창", "menu": "막창", "tags": ["인생기준"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>여기 먹어보기 전에는 막창을 안 좋아하는 줄 알았다.<\/p>", "memo": "", "sources": ""}, {"name": "성수족발", "status": "선정", "grade": "", "gradeSug": "", "sido": "확인 필요", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "족발", "menu": "족발", "tags": ["한방"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>족발이 진짜 맛있다.<\/p>", "memo": "", "sources": ""}, {"name": "영진돼지국밥본점", "status": "선정", "grade": "", "gradeSug": "3", "sido": "부산", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "돼지국밥", "menu": "돼지국밥", "tags": ["한방", "노포"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>돼지국밥 제일 맛있다. 본점은 노포라 더 좋은 듯.<\/p>", "memo": "", "sources": ""}, {"name": "이씨할매횟집", "status": "선정", "grade": "", "gradeSug": "2", "sido": "부산", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "횟집", "menu": "회", "tags": ["사주기좋은", "이것저것", "술술", "분위기"], "mood": "바다 전망", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>가성비가 괜찮고 스끼다시가 좋아서 술 먹기 좋다. 이것저것 나온다. 바다가 보여서 분위기도 좋다.<\/p>", "memo": "", "sources": ""}, {"name": "형제전통돼지국밥", "status": "선정", "grade": "", "gradeSug": "", "sido": "부산", "sgg": "확인 필요", "dong": "", "addr": "확인 필요", "genre": "돼지국밥", "menu": "돼지국밥", "tags": ["노포"], "mood": "", "plus": "간이 안 된 채로 나와 직접 간을 맞춰 먹을 수 있음", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>완전 노포에 맛도 괜찮다. 간이 안 된 채로 나와서 내가 간을 해 먹을 수 있어서 좋다.<\/p>", "memo": "", "sources": ""}, {"name": "만족오향족발 시청점", "status": "선정", "grade": "", "gradeSug": "2", "sido": "서울", "sgg": "확인 필요", "dong": "시청", "addr": "확인 필요", "genre": "족발", "menu": "족발", "tags": ["한방", "술술"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>족발이 진짜 맛있다. 메인 하나가 눈에 띄게 맛있어서 좋고, 술이 술술 들어간다.<\/p>", "memo": "", "sources": ""}, {"name": "미소네", "status": "선정", "grade": "", "gradeSug": "", "sido": "서울", "sgg": "확인 필요", "dong": "사당", "addr": "확인 필요", "genre": "술집", "menu": "", "tags": ["사주기좋은", "이것저것", "술술", "분위기"], "mood": "정겨움", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>음식이 대단하기보다 가성비가 너무 좋다. 조잡하면서도 술집다운 분위기가 좋다. 누구 사줘야 할 때 부담이 적고 이것저것 나와서 좋다.<\/p>", "memo": "<ul><li>&#x27;사당&#x27;은 동작구·서초구에 걸친 지역이라 시군구 확인 필요<\/li><\/ul>", "sources": ""}, {"name": "오코노미야끼 하나", "status": "선정", "grade": "", "gradeSug": "", "sido": "서울", "sgg": "광진구", "dong": "", "addr": "확인 필요", "genre": "일식", "menu": "오코노미야끼", "tags": ["현지그대로"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>현지 느낌이 나고 음식 자체도 맛있다. 사장님이 일본분이라 더 맛있게 느껴지는 것 같기도 하다.<\/p>", "memo": "", "sources": ""}, {"name": "회화원", "status": "선정", "grade": "", "gradeSug": "2", "sido": "서울", "sgg": "확인 필요", "dong": "사당", "addr": "확인 필요", "genre": "양꼬치", "menu": "양꼬치", "tags": ["술술", "한방", "분위기"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>양꼬치 자체가 다른 데보다 맛있고 요리류도 다 맛있다. 술이 술술 들어간다. 분위기도 괜찮고 맥주도 맛있다.<\/p>", "memo": "<ul><li>&#x27;사당&#x27;은 동작구·서초구에 걸친 지역이라 시군구 확인 필요<\/li><\/ul>", "sources": ""}, {"name": "남양수산", "status": "선정", "grade": "", "gradeSug": "3", "sido": "제주", "sgg": "서귀포시", "dong": "성산읍", "addr": "확인 필요", "genre": "횟집", "menu": "돌돔회, 지리탕", "tags": ["술술", "한방", "이것저것", "분위기"], "mood": "정겨움", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>돌돔회도 맛있지만 무엇보다 지리탕이 진짜 너무 맛있다. 회 먹고 지리탕, 밥 비벼 먹으면 소주가 술술 들어간다. 조잡하면서도 정겨운, 소주 먹기 좋은 분위기.<\/p>", "memo": "", "sources": ""}, {"name": "영성각", "status": "선정", "grade": "", "gradeSug": "3", "sido": "충남", "sgg": "서산시", "dong": "", "addr": "확인 필요", "genre": "중식", "menu": "짬뽕, 탕수육", "tags": ["인생기준", "한방"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>처음으로 짬뽕이 맛있다고 생각한 곳. 원래 면과 해산물 몇 개만 먹는데, 여기서 처음으로 건더기와 국물까지 다 먹었다. 탕수육도 괜찮다.<\/p>", "memo": "", "sources": ""}, {"name": "대교식당", "status": "선정", "grade": "", "gradeSug": "", "sido": "충북", "sgg": "단양군", "dong": "", "addr": "확인 필요", "genre": "해장국", "menu": "올갱이해장국", "tags": ["해장"], "mood": "", "plus": "", "minus": "", "basis": "고민수 직접 방문", "year": "확인 필요", "src": "0", "age": "", "checked": "", "note": "<p>아침에 올갱이해장국을 먹었는데 음식이 너무 좋았다. 해장이 너무 잘 되고 음식 자체를 잘하신다.<\/p>", "memo": "", "sources": ""}], TAGS={"술술": "🍶", "한방": "🎯", "이것저것": "🍱", "푸짐": "🥘", "사주기좋은": "💰", "해장": "🍲", "현지그대로": "🗾", "분위기": "🏮", "노포": "⏳", "인생기준": "⭐"}, STATUS=["선정", "답사 예정", "후보", "보류", "탈락", "폐업 확인"], GRADES={"1": "근처면 가볼 만하다", "2": "이거 먹으러 가볼 만하다", "3": "맛집 중의 맛집"};
const st={q:"",status:"",grade:"",sido:new Set(),tags:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unk=v=>!v||v==="확인 필요"?'<span class="unk">확인 필요</span>':esc(v);

function initFilters(){
  const s=$("#status");s.innerHTML='<option value="">모든 상태</option>'+STATUS.map(x=>`<option>${x}</option>`).join("");
  const g=$("#grade");g.innerHTML='<option value="">모든 등급</option>'+Object.keys(GRADES).map(k=>`<option value="${k}">${k} · ${GRADES[k]}</option>`).join("")+'<option value="none">등급 미정</option>';
  const sidos=[...new Set(DATA.map(d=>d.sido||"확인 필요"))].sort();
  for(const x of sidos){const b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{st.sido.has(x)?st.sido.delete(x):st.sido.add(x);b.classList.toggle("on");render()};$("#sido").append(b)}
  for(const [k,e] of Object.entries(TAGS)){const b=document.createElement("button");b.className="chip";b.textContent=e+" "+k;b.onclick=()=>{st.tags.has(k)?st.tags.delete(k):st.tags.add(k);b.classList.toggle("on");render()};$("#tagrow").append(b)}
  $("#q").oninput=e=>{st.q=e.target.value.trim();render()};
  s.onchange=e=>{st.status=e.target.value;render()};
  g.onchange=e=>{st.grade=e.target.value;render()};
}
function match(d){
  if(st.status&&d.status!==st.status)return false;
  if(st.grade==="none"&&d.grade)return false;
  if(st.grade&&st.grade!=="none"&&d.grade!==st.grade)return false;
  if(st.sido.size&&!st.sido.has(d.sido||"확인 필요"))return false;
  for(const t of st.tags)if(!d.tags.includes(t))return false;
  if(st.q){const h=[d.name,d.menu,d.dong,d.sgg,d.sido,d.genre,d.addr].join(" ");if(!h.includes(st.q))return false}
  return true;
}
function card(d){
  const loc=[d.sido,d.sgg!=="확인 필요"?d.sgg:"",d.dong].filter(Boolean).join(" ");
  const grade=d.grade?`<div class="grade">${"★".repeat(+d.grade)} ${GRADES[d.grade]}</div>`:(d.status==="선정"?`<div class="grade sug">등급 미정${d.gradeSug?" (제안 "+esc(d.gradeSug)+")":""}</div>`:"");
  const tags=d.tags.map(t=>`<span class="tag">${TAGS[t]||""} ${esc(t)}${t==="분위기"&&d.mood?" · "+esc(d.mood):""}</span>`).join("");
  return `<article class="card">
  <div class="top"><div><h2 class="name">${esc(d.name)}${d.age?`<span class="age">업력 ${esc(d.age)}</span>`:""}</h2><div class="loc">${esc(loc)}</div></div><span class="badge ${esc(d.status)}">${esc(d.status)}</span></div>
  ${grade}
  <div class="meta">${esc(d.genre)}${d.menu?" · "+esc(d.menu):""}</div>
  ${tags?`<div class="tags">${tags}</div>`:""}
  ${d.note?`<div class="note">${d.note}</div>`:""}
  <details><summary>상세 정보</summary>
   <dl><dt>주소</dt><dd>${unk(d.addr)}</dd><dt>개업연도</dt><dd>${unk(d.year)}</dd>
   ${d.plus?`<dt>가점</dt><dd>${esc(d.plus)}</dd>`:""}${d.minus?`<dt>감점</dt><dd>${esc(d.minus)}</dd>`:""}
   <dt>진입근거</dt><dd>${esc(d.basis)||"-"}</dd><dt>출처 수</dt><dd>${esc(d.src)}</dd><dt>최종확인</dt><dd>${esc(d.checked)||"-"}</dd></dl>
   ${d.memo?"<b>조사 메모</b>"+d.memo:""}${d.sources?"<b>출처</b>"+d.sources:""}
  </details></article>`;
}
function render(){
  const list=DATA.filter(match).sort((a,b)=>(+b.grade||0)-(+a.grade||0)||a.sido.localeCompare(b.sido)||a.name.localeCompare(b.name));
  $("#list").innerHTML=list.length?list.map(card).join(""):'<p class="empty">조건에 맞는 식당이 없습니다.</p>';
  const c=s=>DATA.filter(d=>d.status===s).length;
  $("#stats").innerHTML=`<span class="stat">전체 <b>${DATA.length}</b></span><span class="stat">선정 <b>${c("선정")}</b></span><span class="stat">후보 <b>${c("후보")}</b></span><span class="stat">답사 예정 <b>${c("답사 예정")}</b></span><span class="stat">표시 중 <b>${list.length}</b></span>`;
}
initFilters();render();
</script>
</body>
</html>
